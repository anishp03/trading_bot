root: /Users/anishpatel/Documents/SoftwareProject
vault: /Users/anishpatel/Documents/SoftwareProject/ProjectBrain/Vault
storage: /Users/anishpatel/Documents/SoftwareProject/ProjectBrain/RAG/storage

include:
  - AGENTS.md
  - ProjectBrain/Vault/**/*.md
  - ProjectBrain/RAG/Brain Memory Manual.md
  - ProjectBrain/RAG/memory.yml
  - ProjectBrain/RAG/scripts/*.py
  - run.sh
  - .gitignore
  - README.md
  - production_backend/.mvn/wrapper/maven-wrapper.properties
  - production_backend/mvnw
  - production_backend/mvnw.cmd
  - production_backend/pom.xml
  - production_backend/**/*.md
  - production_backend/src/*.java
  - production_backend/resources/**/*
  - production_backend/tests/*.java
  - frontend/eslint.config.js
  - frontend/index.html
  - frontend/package.json
  - frontend/package-lock.json
  - frontend/public/_headers
  - frontend/src/**/*.{js,jsx,ts,tsx,css}
  - frontend/tests/**/*.{js,jsx,ts,tsx,css}
  - frontend/functions/**/*.js
  - frontend/vite.config.js
